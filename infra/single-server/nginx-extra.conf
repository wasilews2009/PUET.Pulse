# nginx server blocks for Keycloak (sso.) and LiveKit (meet.) on the single server.
# Put next to infra/nginx/pulse.conf in /etc/nginx/conf.d/ and replace the host names.
# Certificates: certbot --nginx -d <pulse> -d <sso> -d <meet> (docs/SERVER_SETUP.md).

server {
    listen 443 ssl;
    http2 on;
    server_name sso.example.org;

    ssl_certificate     /etc/letsencrypt/live/pulse.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.example.org/privkey.pem;
    ssl_protocols       TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The admin console only from trusted addresses: put your own IP or the
    # university's range here (curl -4 ifconfig.me shows your IP).
    location /admin/ {
        allow 203.0.113.10;      # REPLACE with your IP
        deny all;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meet.example.org;

    ssl_certificate     /etc/letsencrypt/live/pulse.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.example.org/privkey.pem;
    ssl_protocols       TLSv1.3;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
