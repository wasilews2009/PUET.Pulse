# Example reverse proxy for PUET.Pulse (TLS 1.3, HSTS, strict CSP).
# The web client (apps/web/dist) and the API share one origin:
#   /api/*    -> NestJS API (prefix stripped), /api/ws/ -> Socket.io (/ws/)
#   /*        -> static SPA with index.html fallback
# Set WEB_ORIGIN=https://pulse.puet.edu.ua for the API (CSRF / CSWSH checks).

upstream pulse_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pulse.puet.edu.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04) has no `http2 on;`
    server_name pulse.puet.edu.ua;

    ssl_certificate     /etc/puet/tls/fullchain.pem;
    ssl_certificate_key /etc/puet/tls/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 51m;   # FILE_MAX_MB + headers

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Calls (Phase 7) need the camera, microphone and screen capture on this origin only.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
    # connect-src adds the LiveKit host (LIVEKIT_PUBLIC_URL); WebRTC media itself is not governed by CSP.
    # 'wasm-unsafe-eval' lets the browser compile vodozemac (WebAssembly); no 'unsafe-eval', no inline scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://pulse.puet.edu.ua wss://meet.pulse.puet.edu.ua https://meet.pulse.puet.edu.ua; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # Socket.io requests /api/ws/?EIO=4&transport=websocket (trailing slash), so this
    # must be a prefix match; an exact `= /api/ws` would fall through to /api/ without Upgrade.
    location /api/ws/ {
        proxy_pass http://pulse_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://pulse_api/;   # trailing slash strips /api
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    root /srv/puet-pulse/web;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Digital Asset Links for the Android app (apps/android): a real 404 when
    # the file is missing, never the SPA's index.html.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://meet.pulse.puet.edu.ua https://meet.pulse.puet.edu.ua; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}
