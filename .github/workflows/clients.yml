# Installers of the PUET.Pulse client apps:
#   Windows: NSIS installer (.exe, x64 + arm64) and MSI (x64, for GPO / Intune)
#   Android: APK (direct install / MDM) and AAB (Google Play)
#
# Runs on pull requests that touch the apps (unsigned test builds), by hand
# (Actions > Clients > Run workflow) and on tags clients-vX.Y.Z (signed builds
# attached to a GitHub Release). The server address and signing material come
# from repository variables and secrets, never from the repository itself:
#   vars.PULSE_URL, vars.PULSE_SSO_HOSTS
#   secrets.WIN_CSC_LINK (base64 .pfx), secrets.WIN_CSC_KEY_PASSWORD
#   or Azure Trusted Signing: vars.AZURE_SIGN_ENDPOINT, vars.AZURE_SIGN_ACCOUNT,
#     vars.AZURE_SIGN_PROFILE, vars.AZURE_SIGN_PUBLISHER, secrets.AZURE_TENANT_ID,
#     secrets.AZURE_CLIENT_ID, secrets.AZURE_CLIENT_SECRET
#   secrets.ANDROID_KEYSTORE_BASE64, secrets.ANDROID_KEYSTORE_PASSWORD,
#     secrets.ANDROID_KEY_ALIAS, secrets.ANDROID_KEY_PASSWORD
# See apps/desktop/README.md and apps/android/README.md.

name: Clients

on:
  workflow_dispatch:
    inputs:
      pulse_url:
        description: "Server (https://...). Empty: the PULSE_URL repository variable"
        required: false
        default: ""
      sso_hosts:
        description: "Sign-in hosts, comma-separated. Empty: the PULSE_SSO_HOSTS variable"
        required: false
        default: ""
  push:
    tags: ["clients-v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/android/**"
      - ".github/workflows/clients.yml"

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

env:
  # Passed through env (never interpolated into scripts) so inputs cannot inject commands.
  # Without repository variables the builds target the pilot server; set
  # vars.PULSE_URL / vars.PULSE_SSO_HOSTS when the university domain is live.
  PULSE_URL: ${{ inputs.pulse_url || vars.PULSE_URL || 'https://puet-pulse.duckdns.org' }}
  PULSE_SSO_HOSTS: ${{ inputs.sso_hosts || vars.PULSE_SSO_HOSTS || 'sso.puet-pulse.duckdns.org' }}
  REF_NAME: ${{ github.ref_name }}
  REF_TYPE: ${{ github.ref_type }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @puet/desktop
      - run: pnpm --filter @puet/desktop test

      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^clients-v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          "PULSE_VERSION=$v" >> $env:GITHUB_ENV

      - name: Code signing (optional)
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
        run: |
          if ($env:WIN_CSC_LINK) {
            $p = Join-Path $env:RUNNER_TEMP 'puet-codesign.pfx'
            [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:WIN_CSC_LINK))
            "CSC_LINK=$p" >> $env:GITHUB_ENV
            "PULSE_SIGNING=pfx" >> $env:GITHUB_ENV
          } elseif ($env:AZURE_SIGN_ENDPOINT) {
            "PULSE_SIGNING=azure" >> $env:GITHUB_ENV
          } else {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $env:GITHUB_ENV
            "PULSE_SIGNING=none" >> $env:GITHUB_ENV
            Write-Output "::warning::No code-signing certificate configured: the Windows installer is unsigned (SmartScreen will warn users)."
          }

      - name: Build installers
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          pnpm build
          pnpm dist:config
          $extra = @("-c.extraMetadata.version=$env:PULSE_VERSION")
          if ($env:PULSE_SIGNING -eq 'azure') {
            $extra += "-c.win.azureSignOptions.endpoint=$env:AZURE_SIGN_ENDPOINT"
            $extra += "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_SIGN_ACCOUNT"
            $extra += "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_SIGN_PROFILE"
            $extra += "-c.win.azureSignOptions.publisherName=$env:AZURE_SIGN_PUBLISHER"
          }
          pnpm exec electron-builder --win --publish never @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check signatures and write checksums
        shell: pwsh
        working-directory: apps/desktop/release
        run: |
          $files = Get-ChildItem -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($env:PULSE_SIGNING -ne 'none' -and $s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: puet-pulse-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          v=0.1.0
          if [[ "$REF_TYPE" == tag && "$REF_NAME" =~ ^clients-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then v="${BASH_REMATCH[1]}"; fi
          echo "PULSE_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "PULSE_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/puet-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/puet-release.jks" >> "$GITHUB_ENV"
          elif [[ "$REF_TYPE" == tag ]]; then
            echo "::error::A release tag needs the Android keystore secrets (a debug-signed APK is never released)."
            exit 1
          else
            echo "::warning::No Android keystore configured: only a debug-signed test APK is built."
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [[ -n "${ANDROID_KEYSTORE_FILE:-}" ]]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "out/PUET.Pulse-$PULSE_VERSION_NAME.apk"
            cp app/build/outputs/bundle/release/app-release.aab "out/PUET.Pulse-$PULSE_VERSION_NAME.aab"
            fp=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | awk '/SHA256:/{print $2; exit}')
            scripts/assetlinks.sh "$fp" > out/assetlinks.json
            echo "Release key SHA-256: $fp"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "out/PUET.Pulse-$PULSE_VERSION_NAME-test.apk"
          fi
          (cd out && sha256sum PUET.Pulse-* > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: puet-pulse-android
          path: apps/android/out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$REF_NAME" dist/* --title "PUET.Pulse clients ${REF_NAME#clients-v}" --notes "Windows (NSIS, MSI) and Android (APK, AAB) for $PULSE_URL. Check files against the SHA256SUMS files."
